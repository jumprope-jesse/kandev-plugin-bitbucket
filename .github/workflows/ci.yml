name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tidy, format, vet, and test
    runs-on: ubuntu-latest
    env:
      KANDEV_PLUGIN_E2E_URL: ${{ secrets.KANDEV_PLUGIN_E2E_URL }}
    steps:
      # The local SDK replacement in go.mod expects these checkouts to be
      # siblings: plugin/../kandev/apps/backend.
      - name: Check out plugin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin

      - name: Check out kandev SDK
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          # Pre-release contract pin. Replace this with the released host tag
          # through manifest.min_kandev_version before publishing the plugin.
          ref: 56ab6bbb3724489de22f42a97b53f8a40ed38433
          path: kandev
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install UI dependencies
        working-directory: plugin
        run: npm ci

      - name: Check module files are tidy
        working-directory: plugin
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        working-directory: plugin
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }

      - name: Vet
        working-directory: plugin
        run: make vet

      - name: Test
        working-directory: plugin
        run: make test

      - name: Package current host artifact
        working-directory: plugin
        run: make package-host verify-package-host

      - name: Exercise the packaged plugin in Kandev
        if: ${{ env.KANDEV_PLUGIN_E2E_URL != '' }}
        working-directory: plugin
        run: make e2e

      - name: Report unavailable packaged-host contract
        if: ${{ env.KANDEV_PLUGIN_E2E_URL == '' }}
        run: >-
          echo "::notice title=Packaged-host contract unavailable::Configure
          KANDEV_PLUGIN_E2E_URL with a disposable compatible Kandev host to run
          packaged desktop/mobile E2E on pull requests. Tag releases remain fail-fast."
