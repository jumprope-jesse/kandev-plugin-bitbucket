# Create a GitHub Release from every version tag. The package's internal
# checksums.txt is extracted and uploaded alongside the 5-platform tarball.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Verify release version and minimum host
        id: manifest
        working-directory: plugin
        run: |
          version="$(sed -nE 's/^version: "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' manifest.yaml)"
          min_kandev_version="$(sed -nE 's/^min_kandev_version: "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' manifest.yaml)"
          test "$GITHUB_REF_NAME" = "v$version"
          test -n "$min_kandev_version" || { echo "min_kandev_version must name the released compatible host"; exit 1; }
          echo "min_kandev_version=$min_kandev_version" >> "$GITHUB_OUTPUT"

      - name: Check out kandev SDK
        uses: actions/checkout@v4
        with:
          repository: kdlbs/kandev
          ref: v${{ steps.manifest.outputs.min_kandev_version }}
          path: kandev
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install UI dependencies
        working-directory: plugin
        run: npm ci

      - name: Verify
        working-directory: plugin
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
          make vet
          make test

      - name: Exercise the packaged plugin in Kandev
        working-directory: plugin
        env:
          KANDEV_PLUGIN_E2E_URL: ${{ secrets.KANDEV_PLUGIN_E2E_URL }}
        run: make e2e

      - name: Package (all platforms)
        working-directory: plugin
        run: make package verify-package

      - name: Extract package checksums
        working-directory: plugin
        run: |
          pkg="$(ls kandev-plugin-*-*.tar.gz)"
          tar -xzf "$pkg" checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugin/kandev-plugin-bitbucket-*.tar.gz
            plugin/checksums.txt
          generate_release_notes: true
