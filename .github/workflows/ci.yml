name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tidy, format, vet, and test
    runs-on: ubuntu-latest
    steps:
      # The local SDK replacement in go.mod expects these checkouts to be
      # siblings: plugin/../kandev/apps/backend.
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out kandev SDK
        uses: actions/checkout@v4
        with:
          repository: kdlbs/kandev
          # Pre-release contract pin. Replace this with the released host tag
          # through manifest.min_kandev_version before publishing the plugin.
          ref: 99a0cb3117889424c21d978c94588e61945a595f
          path: kandev
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install UI dependencies
        working-directory: plugin
        run: npm ci

      - name: Check module files are tidy
        working-directory: plugin
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        working-directory: plugin
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }

      - name: Vet
        working-directory: plugin
        run: make vet

      - name: Test
        working-directory: plugin
        run: make test

      - name: Package current host artifact
        working-directory: plugin
        run: make package-host verify-package-host

      # This is intentionally required rather than skipped: a green CI run
      # without a disposable host would not prove that the package can install
      # and load. Fork pull requests cannot receive repository secrets, so
      # they retain the build/package checks while only trusted same-repository
      # changes can use the disposable host. The tag release gate is never
      # conditional and always runs this check before publishing.
      - name: Exercise the packaged plugin in Kandev
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: plugin
        env:
          KANDEV_PLUGIN_E2E_URL: ${{ secrets.KANDEV_PLUGIN_E2E_URL }}
        run: make e2e
